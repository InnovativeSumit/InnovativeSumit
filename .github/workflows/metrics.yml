# Save this file as: .github/workflows/metrics.yml
# in your InnovativeSumit/InnovativeSumit repo (the one your README lives in).
#
# What it does:
# - Runs automatically every day (and whenever you push to the repo)
# - Generates your GitHub stats + top languages as a static SVG
# - Commits that SVG into a branch called "metrics" in your repo
# - Your README then points to that file, so it NEVER depends on the
#   public github-readme-stats.vercel.app server that's been going down.

name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  push:
    branches: [ main ]
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: InnovativeSumit
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_achievements: yes
          plugin_achievements_threshold: C
          committer_branch: metrics
          filename: github-metrics.svg
          config_timezone: Asia/Kolkata
